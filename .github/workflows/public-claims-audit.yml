name: Public claims audit

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'scripts/audit-public-claims.mjs'
      - '.github/workflows/public-claims-audit.yml'
  workflow_dispatch:

jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check audited privacy, availability and profile claims
        run: node scripts/audit-public-claims.mjs
