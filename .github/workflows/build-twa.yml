# Build LeanOn TWA (Trusted Web Activity) Android app
# Triggered manually: GitHub Actions tab → "Build Android TWA" → Run workflow
#
# Builds a signed .aab file directly with Gradle — no PWABuilder, no Bubblewrap CLI.
# Download the signed AAB and keystore from the workflow Artifacts section after the run.
#
# FIRST RUN: the workflow auto-generates a keystore + password.
#   - The keystore downloads as an artifact (expires in 7 days — save it to Google Drive!).
#   - Save the password shown in the warning annotation as GitHub Secret KEYSTORE_PASSWORD.
#     (Settings → Secrets and variables → Actions → New repository secret)
# SUBSEQUENT RUNS: set KEYSTORE_PASSWORD + KEY_PASSWORD secrets so the same key is reused.

name: Build Android TWA

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (integer — must increase with each Play Store upload)'
        required: true
        default: '1'
      version_name:
        description: 'Version name shown to users (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Toolchain ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            2>/dev/null || true

      # ── 3. Signing keystore ────────────────────────────────────────────────
      - name: Generate (or reuse) signing keystore
        run: |
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"

          if [ -z "$KS_PASS" ]; then
            KS_PASS=$(openssl rand -base64 24 | tr -d '=+/\n' | cut -c1-20)
            KEY_PASS="$KS_PASS"
            echo "::warning::FIRST RUN — add this as GitHub Secret KEYSTORE_PASSWORD: $KS_PASS"
          fi
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$KS_PASS"
          fi

          keytool -genkeypair \
            -alias leanon \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keystore leanon-keystore.jks \
            -storepass "$KS_PASS" \
            -keypass  "$KEY_PASS" \
            -dname "CN=LeanOn App, O=LeanOn, L=India, C=IN" \
            2>&1

          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS"      >> "$GITHUB_ENV"

      # ── 4. App icons ────────────────────────────────────────────────────────
      - name: Download and resize app icons
        run: |
          # Download the 512 px master icon from the live site
          curl -sL "https://www.leanon.app/icon-512.png" -o /tmp/icon-master.png

          for row in "48:mdpi" "72:hdpi" "96:xhdpi" "144:xxhdpi" "192:xxxhdpi"; do
            sz="${row%%:*}"; dens="${row##*:}"
            dest="twa/app/src/main/res/mipmap-${dens}"
            mkdir -p "$dest"
            # Try ImageMagick; fall back to copying the master if it isn't available
            convert /tmp/icon-master.png -resize "${sz}x${sz}" "$dest/ic_launcher.png" 2>/dev/null \
              || cp /tmp/icon-master.png "$dest/ic_launcher.png"
          done

      # ── 5. Android project files ───────────────────────────────────────────
      - name: Create Android TWA project
        run: |
          VER_CODE="${{ github.event.inputs.version_code }}"
          VER_NAME="${{ github.event.inputs.version_name }}"

          mkdir -p twa/app/src/main/res/values

          # ── settings.gradle ──────────────────────────────────────────
          cat > twa/settings.gradle << 'GRADLE'
include ':app'
GRADLE

          # ── root build.gradle ────────────────────────────────────────
          cat > twa/build.gradle << 'GRADLE'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
GRADLE

          # ── gradle.properties ────────────────────────────────────────
          cat > twa/gradle.properties << 'PROPS'
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2g
PROPS

          # ── local.properties (SDK path) ──────────────────────────────
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > twa/local.properties

          # ── app/build.gradle ─────────────────────────────────────────
          # (Version values injected from shell variables — not heredoc)
          cat > twa/app/build.gradle << GRADLE
apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "app.leanon.twa"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode ${VER_CODE}
        versionName "${VER_NAME}"
    }
    signingConfigs {
        release {
            keyAlias     'leanon'
            keyPassword  System.getenv('KEY_PASSWORD')
            storeFile    file('../../leanon-keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
GRADLE

          # ── AndroidManifest.xml ──────────────────────────────────────
          cat > twa/app/src/main/AndroidManifest.xml << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET"/>

    <application
        android:label="LeanOn"
        android:icon="@mipmap/ic_launcher"
        android:theme="@style/Theme.AppCompat.NoActionBar">

        <meta-data
            android:name="asset_statements"
            android:resource="@string/asset_statements"/>

        <!-- Main TWA launcher activity -->
        <activity
            android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
            android:exported="true">

            <meta-data
                android:name="android.support.customtabs.trusted.DEFAULT_URL"
                android:value="https://www.leanon.app"/>
            <meta-data
                android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                android:resource="@color/colorPrimary"/>
            <meta-data
                android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                android:resource="@color/colorPrimary"/>
            <meta-data
                android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                android:resource="@color/colorPrimary"/>
            <meta-data
                android:name="android.support.customtabs.trusted.DISPLAY_MODE"
                android:value="standalone"/>

            <!-- Launcher intent -->
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

            <!-- Digital Asset Links verification (removes the URL bar) -->
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="https" android:host="www.leanon.app"/>
            </intent-filter>
        </activity>

        <!-- Background service required by TWA -->
        <service
            android:name="com.google.androidbrowserhelper.trusted.DelegationService"
            android:exported="true">
            <intent-filter>
                <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE"/>
                <category android:name="android.intent.category.DEFAULT"/>
            </intent-filter>
        </service>

    </application>
</manifest>
XML

          # ── res/values/strings.xml ───────────────────────────────────
          cat > twa/app/src/main/res/values/strings.xml << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">LeanOn</string>
    <!-- Digital Asset Links statement for TWA verification -->
    <string name="asset_statements">
        [{"relation":["delegate_permission/common.handle_all_urls"],
          "target":{"namespace":"web","site":"https://www.leanon.app"}}]
    </string>
</resources>
XML

          # ── res/values/colors.xml ────────────────────────────────────
          cat > twa/app/src/main/res/values/colors.xml << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="colorPrimary">#0F4867</color>
    <color name="colorPrimaryDark">#0F4867</color>
    <color name="colorAccent">#1A8FA0</color>
</resources>
XML

      # ── 6. Gradle wrapper ──────────────────────────────────────────────────
      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate gradlew in project
        run: |
          cd twa
          gradle wrapper --gradle-version=8.4 2>&1
          chmod +x gradlew

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: Build signed AAB
        working-directory: twa
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:      ${{ env.KEY_PASSWORD }}
          ANDROID_SDK_ROOT:  ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace 2>&1

      # ── 8. Fingerprint ─────────────────────────────────────────────────────
      - name: Get SHA-256 fingerprint (paste this to Claude)
        run: |
          echo ""
          echo "============================================"
          echo " SHA-256 fingerprint — paste this to Claude"
          echo "============================================"
          keytool -list -v \
            -keystore leanon-keystore.jks \
            -alias leanon \
            -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep "SHA256:"
          echo "============================================"
          echo ""

      # ── 9. Artifacts ───────────────────────────────────────────────────────
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: leanon-signed-aab
          path: twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload keystore (⚠ save to Google Drive — expires in 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: leanon-keystore-SAVE-THIS
          path: leanon-keystore.jks
          retention-days: 7

      # ── 10. Summary ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ Build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Package ID** | app.leanon.twa |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Next steps" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download **leanon-signed-aab** → upload to Google Play" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Download **leanon-keystore-SAVE-THIS** → save to Google Drive NOW" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Copy the SHA-256 fingerprint from the step above → paste to Claude" >> "$GITHUB_STEP_SUMMARY"
