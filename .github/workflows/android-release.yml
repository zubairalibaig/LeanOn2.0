name: Android release bundle

# Builds the signed Play Store bundle for the TWA shell in android/.
#
# The web app itself is NOT built here — it ships via Vercel on push to main, as
# it always has. This workflow only produces the native wrapper, which is why it
# is deliberately not part of the normal push pipeline: the shell only needs
# rebuilding when android/ changes or a new store release is cut.
#
# Signing material never touches the repo. Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    — base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  — keystore password
#   ANDROID_KEY_ALIAS          — key alias inside the keystore
#   ANDROID_KEY_PASSWORD       — password for that alias
#   GOOGLE_SERVICES_JSON       — contents of android/app/google-services.json
# See ANDROID.md for how to create each of these.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name shown in Play (e.g. 1.0.3)'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Version code — must increase on every upload'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # A tag named android-v1.0.3 yields versionName 1.0.3. Play rejects a
      # bundle whose versionCode is not strictly greater than the last upload,
      # so the run number is used — it only ever increases.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.versionName }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.versionCode }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set — push notifications would be dead in this build."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot sign the bundle."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      # Prints the fingerprint that must appear in ANDROID_ASSETLINKS_SHA256 on
      # Vercel. This is the UPLOAD key; once Play App Signing is active the
      # fingerprint that matters is Play's, from Play Console > App integrity.
      - name: Report upload-key fingerprint
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            | grep -A1 'SHA256:' || true

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: leanon-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
