name: One-time Quality tab rebuild

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust Quality UI patch
        run: |
          python3 scripts/patch_admin_quality2.py
          grep -Fq 'Trial → Paid · 7d' app/admin/page.tsx
          grep -Fq 'Missing telemetry' app/admin/page.tsx
          grep -Fq 'qualityWindow' app/admin/page.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/page.tsx
          git commit -m 'Rebuild admin Quality tab [quality-patched]'
          git push
