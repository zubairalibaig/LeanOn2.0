name: One-time Quality tab rebuild

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Quality UI patch
        run: |
          if git log -1 --pretty=%B | grep -q '\[quality-patched\]'; then
            echo 'Quality UI already patched; nothing to do.'
            exit 0
          fi
          python3 scripts/patch_admin_quality.py
          grep -q 'Trial → Paid · 7d' app/admin/page.tsx
          grep -q 'Missing telemetry' app/admin/page.tsx
          grep -q 'qualityWindow' app/admin/page.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/page.tsx
          git commit -m 'Rebuild admin Quality tab [quality-patched]'
          git push
      - name: Remove one-time patch workflow and script
        run: |
          if git log -1 --pretty=%B | grep -q '\[quality-patched\]'; then
            rm -f .github/workflows/patch-quality-tab.yml scripts/patch_admin_quality.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Remove one-time Quality patch tooling [quality-patched]'
            git push
          fi
